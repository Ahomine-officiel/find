[package]
name = "find-the-needle"
version = "2.0.0"
edition = "2021"
description = "Rust + wgpu 1:1 remake of the 'Find The Needle' hay-pile needle hunt - golden barn, endless haystack, SELL HAY stall, YARD RESEARCH tree. Zero textures, zero assets, built for potato PCs."
license = "MIT"

[dependencies]
wgpu = "24"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
