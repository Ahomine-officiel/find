name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    name: Windows x64 (release)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: find-the-needle-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: find-the-needle-rs

      - name: Build (release)
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/find-the-needle.exe dist/FindTheNeedle.exe
          Compress-Archive -Path dist/FindTheNeedle.exe -DestinationPath FindTheNeedle-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FindTheNeedle-win64
          path: find-the-needle-rs/FindTheNeedle-win64.zip
          retention-days: 30

      - name: Attach to GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: find-the-needle-rs/FindTheNeedle-win64.zip
